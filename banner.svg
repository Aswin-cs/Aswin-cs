<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="300">
  <defs>
    <!-- Background Gradient (Modern Blue to Pink) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <style>
      .title { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        font-size: 65px; 
        font-weight: 800; 
        fill: #ffffff; 
        opacity: 0; 
        animation: fadeIn 1s cubic-bezier(0.4, 0, 0.2, 1) forwards; 
        animation-delay: 0.5s; 
      }
      
      @keyframes fadeIn { 
        0% { opacity: 0; transform: translateY(15px); } 
        100% { opacity: 1; transform: translateY(0); } 
      }

      /* Logo Animations */
      .al-slash-group { opacity: 0; animation: alFlyIn 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; animation-delay: 0.3s; }
      .al-bracket-group { opacity: 0; animation: alFadeIn 0.5s forwards; animation-delay: 0.8s; }
      .al-sigma-pixel { opacity: 0; transform-box: fill-box; transform-origin: center; animation: alPopIn 0.3s forwards; }
      .al-cursor-pixel { opacity: 0; animation: alBlink 1s infinite; animation-delay: 2.5s; }

      @keyframes alFlyIn { 0% { transform: translateX(-50px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
      @keyframes alFadeIn { 0% { opacity: 0; } 100% { opacity: 0.4; } }
      @keyframes alPopIn { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
      @keyframes alBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    </style>
  </defs>

  <!-- Waving Background Shape -->
  <path d="M0,0 L1200,0 L1200,200 C800,270 400,130 0,200 Z" fill="url(#bgGradient)" />

  <!-- Logo Group -->
  <g transform="translate(234, 45) scale(1.1)">
    <!-- Brackets -->
    <g class="al-bracket-group" fill="none" stroke="#d5d5d5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 45 10 L 15 40 L 45 70" />
      <path d="M 165 10 L 195 40 L 165 70" />
    </g>

    <!-- Slash -->
    <g class="al-slash-group" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round">
      <path d="M 150 10 L 125 70" />
    </g>

    <!-- Sigma -->
    <g fill="#ffffff">
      <rect x="60" y="10" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.3s" />
      <rect x="70" y="10" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.35s" />
      <rect x="80" y="10" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.40s" />
      <rect x="90" y="10" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.45s" />
      <rect x="100" y="10" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.50s" />
      <rect x="90" y="20" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.55s" />
      <rect x="80" y="30" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.60s" />
      <rect x="70" y="40" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.65s" />
      <rect x="80" y="50" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.70s" />
      <rect x="90" y="60" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.75s" />
      <rect x="60" y="70" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.80s" />
      <rect x="70" y="70" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.85s" />
      <rect x="80" y="70" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.90s" />
      <rect x="90" y="70" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.95s" />
      <rect x="100" y="70" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 2.0s" />
    </g>

    <!-- Cursor -->
    <rect class="al-cursor-pixel" x="60" y="90" width="50" height="10" fill="#ffffff" />
  </g>

  <!-- Text Group -->
  <g transform="translate(530, 115)">
    <text x="0" y="0" class="title">Hello, I'm Aswin</text>
  </g>
</svg>
