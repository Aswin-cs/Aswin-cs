<svg viewBox="0 0 1180 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        :root { --bg: #030712; --text: #F8FAFC; --accent: #7C3AED; --accent2: #22D3EE; }
      }
      @media (prefers-color-scheme: light) {
        :root { --bg: #FFFFFF; --text: #0F172A; --accent: #2563EB; --accent2: #06B6D4; }
      }
    </style>
    
    <linearGradient id="gradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#22D3EE;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1"/>
    </linearGradient>

    <linearGradient id="gradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="bgGradDark" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="bgGradLight" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Dark mode background -->
  <g id="darkMode">
    <rect width="1180" height="200" fill="#030712"/>
    <rect width="1180" height="200" fill="url(#bgGradDark)"/>
    
    <!-- Animated border -->
    <rect x="10" y="10" width="1160" height="180" rx="12" ry="12" fill="none" stroke="url(#gradientDark)" stroke-width="2" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Main content area -->
    <rect x="10" y="10" width="1160" height="180" rx="12" ry="12" fill="rgba(15,23,42,0.3)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Animated text content -->
    <text x="60" y="60" font-family="Monaco, Courier New, monospace" font-size="28" font-weight="bold" fill="#F8FAFC">
      Hi 👋 I'm Aswin
    </text>

    <text x="60" y="100" font-family="Monaco, Courier New, monospace" font-size="16" fill="#7C3AED" filter="url(#glow)">
      Full Stack Developer • Open Source Enthusiast • UI Engineer
    </text>

    <!-- Animated decorative elements -->
    <circle cx="1100" cy="50" r="8" fill="#22D3EE" opacity="0.6" filter="url(#glow)">
      <animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1050" cy="150" r="6" fill="#7C3AED" opacity="0.4" filter="url(#glow)">
      <animate attributeName="r" values="6;10;6" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.2;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Light mode background (hidden by default, shown via CSS media query) -->
  <g id="lightMode" style="display:none">
    <rect width="1180" height="200" fill="#FFFFFF"/>
    <rect width="1180" height="200" fill="url(#bgGradLight)"/>
    
    <!-- Animated border -->
    <rect x="10" y="10" width="1160" height="180" rx="12" ry="12" fill="none" stroke="url(#gradientLight)" stroke-width="2" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Main content area -->
    <rect x="10" y="10" width="1160" height="180" rx="12" ry="12" fill="rgba(248,250,252,0.5)" stroke="rgba(15,23,42,0.08)" stroke-width="1"/>

    <!-- Animated text content -->
    <text x="60" y="60" font-family="Monaco, Courier New, monospace" font-size="28" font-weight="bold" fill="#0F172A">
      Hi 👋 I'm Aswin
    </text>

    <text x="60" y="100" font-family="Monaco, Courier New, monospace" font-size="16" fill="#2563EB" filter="url(#glow)">
      Full Stack Developer • Open Source Enthusiast • UI Engineer
    </text>

    <!-- Animated decorative elements -->
    <circle cx="1100" cy="50" r="8" fill="#06B6D4" opacity="0.5" filter="url(#glow)">
      <animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1050" cy="150" r="6" fill="#2563EB" opacity="0.3" filter="url(#glow)">
      <animate attributeName="r" values="6;10;6" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.15;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>