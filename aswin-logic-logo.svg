<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 120" style="display: block; max-width: 100%; height: auto;">
  <style>
    .al-slash-group {
      opacity: 0;
      animation: alFlyIn 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    .al-bracket-group {
      opacity: 0;
      animation: alFadeIn 0.5s 0.5s forwards;
    }
    .al-sigma-pixel {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: alPopIn 0.3s forwards;
    }
    .al-cursor-pixel {
      opacity: 0;
      animation: alBlink 1s 2.25s infinite;
    }

    @keyframes alFlyIn {
      0% { transform: translateX(-100px); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }
    @keyframes alFadeIn {
      0% { opacity: 0; }
      100% { opacity: 0.4; }
    }
    @keyframes alPopIn {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes alBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- Brackets -->
  <g class="al-bracket-group" fill="none" stroke="#d5d5d5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 45 10 L 15 40 L 45 70" />
    <path d="M 165 10 L 195 40 L 165 70" />
  </g>

  <!-- Slash -->
  <g class="al-slash-group" fill="none" stroke="#d9d9d9" stroke-width="10" stroke-linecap="round">
    <path d="M 150 10 L 125 70" />
  </g>

  <!-- Sigma -->
  <g fill="#ffffff">
    <rect x="60" y="10" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.0s" />
    <rect x="70" y="10" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.05s" />
    <rect x="80" y="10" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.10s" />
    <rect x="90" y="10" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.15s" />
    <rect x="100" y="10" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.20s" />
    <rect x="90" y="20" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.25s" />
    <rect x="80" y="30" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.30s" />
    <rect x="70" y="40" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.35s" />
    <rect x="80" y="50" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.40s" />
    <rect x="90" y="60" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.45s" />
    <rect x="60" y="70" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.50s" />
    <rect x="70" y="70" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.55s" />
    <rect x="80" y="70" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.60s" />
    <rect x="90" y="70" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.65s" />
    <rect x="100" y="70" width="10" height="10" class="al-sigma-pixel" style="animation-delay: 1.70s" />
  </g>

  <!-- Cursor -->
  <rect class="al-cursor-pixel" x="60" y="90" width="50" height="10" fill="#ffffff" style="animation-delay: 2.25s" />
</svg>
